# ci for 
name: "CI for Wokflows"
on:
  push:
    branches:
      - actions_test
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up MAVEN3.9
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: |
          mvn clean install
          mvn test
      - name: Run tests
        run: mvn test
      - name: Upload test results
        uses: actions/upload-artifact@v2
        with:
          name: test-results
      - name: build
        run: mvn package
  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up MAVEN3.9
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Publish to Maven Central
        run: mvn deploy --settings .github/workflows/settings.xml
      - name: Build and push Docker image
        run: |
          docker build -t my-docker-image
          docker build -t my-docker-image:latest .
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          # Replace 'my-docker-repo' with your actual Docker repository name
          docker tag my-docker-image my-docker-repo/my-docker-image
          docker push my-docker-repo/my-docker-image
