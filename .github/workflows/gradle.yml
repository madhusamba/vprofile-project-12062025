name: Java CI with Maven

on:
  push:
    branches: [ "local" ]  # Change "main" to your target branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean install

      # Optional: Deploy to server, for example using SCP (replace with your logic)
      # - name: Deploy to EC2 server
      #   run: |
      #     scp target/your-app.jar ec2-user@your-ec2-host:/home/ec2-user/app/
      #     ssh ec2-user@your-ec2-host 'bash /home/ec2-user/app/restart.sh'
      #   env:
      #     PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}

